<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#7C2D12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>El Reino de Inglés: Aventura Medieval 🛡️👑</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=MedievalSharp&display=swap" rel="stylesheet">

<!-- Motor 3D Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
  :root {
    --gold: #F59E0B;
    --gold-dark: #B45309;
    --wood: #78350F;
    --wood-dark: #451A03;
    --primary: #2563EB;
    --primary-dark: #1E40AF;
    --secondary: #10B981;
    --coral: #EF4444;
    --purple: #8B5CF6;
    --bg-dark: #0F172A;
    --card-bg: rgba(255, 253, 245, 0.95);
    --card-border: rgba(120, 53, 15, 0.4);
    --text-main: #271C19;
    --text-muted: #654D47;
    --shadow-realm: 0 10px 0 rgba(69, 26, 3, 0.3), 0 20px 30px rgba(0, 0, 0, 0.3);
    --font-heading: 'MedievalSharp', 'Fredoka', cursive, serif;
    --font-body: 'Nunito', sans-serif;
  }

  [data-theme="night"] {
    --card-bg: rgba(30, 27, 46, 0.95);
    --card-border: rgba(139, 92, 246, 0.4);
    --text-main: #F8FAFC;
    --text-muted: #94A3B8;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  canvas { touch-action: none; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: var(--font-body); background: var(--bg-dark); color: var(--text-main); }
  h1, h2, h3, h4 { font-family: var(--font-heading); margin: 0; }

  #webgl-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; }
  #ui-layer { position: relative; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; pointer-events: none; }
  #ui-layer > * { pointer-events: auto; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px;
    background: linear-gradient(180deg, rgba(120, 53, 15, 0.95), rgba(69, 26, 3, 0.95));
    border-bottom: 4px solid var(--gold); box-shadow: 0 6px 20px rgba(0,0,0,0.4); z-index: 50; color: #FFF;
  }

  .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .brand-avatar { font-size: 2.3rem; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
  .brand-title { font-family: var(--font-heading); font-size: 1.45rem; color: #FDE047; text-shadow: 2px 2px 0 #000; }

  .header-actions { display: flex; align-items: center; gap: 10px; }
  .badge-gold {
    background: linear-gradient(135deg, #F59E0B, #D97706); color: #FFF;
    border-radius: 999px; padding: 6px 16px; font-family: var(--font-heading);
    font-weight: 700; font-size: 1.15rem; box-shadow: 0 4px 0 #78350F; border: 2px solid #FDE047;
    display: flex; align-items: center; gap: 6px; text-shadow: 1px 1px 0 #000;
  }
  .realm-btn {
    background: linear-gradient(180deg, #FFF3D6, #FDE68A); border: 3px solid var(--wood); border-radius: 18px;
    font-size: 1.3rem; padding: 6px 12px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.3);
    transition: transform 0.1s; display: flex; align-items: center; justify-content: center; color: var(--wood-dark);
  }
  .realm-btn:active { transform: translateY(3px); box-shadow: none; }

  main { flex: 1; overflow-y: auto; padding: 16px 16px 100px; max-width: 760px; width: 100%; margin: 0 auto; }

  .btn-medieval {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    font-family: var(--font-heading); font-weight: 700; font-size: 1.25rem;
    border: 3px solid #FDE047; border-radius: 24px; padding: 14px 26px;
    cursor: pointer; color: #FFF; background: linear-gradient(180deg, #D97706, #92400E);
    box-shadow: 0 6px 0 var(--wood-dark); transition: transform 0.08s;
    user-select: none; text-shadow: 1px 2px 3px rgba(0,0,0,0.6);
  }
  .btn-medieval:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--wood-dark); }
  .btn-medieval.blue { background: linear-gradient(180deg, #2563EB, #1E40AF); }
  .btn-medieval.green { background: linear-gradient(180deg, #10B981, #065F46); }
  .btn-medieval.red { background: linear-gradient(180deg, #EF4444, #991B1B); }
  .btn-medieval.purple { background: linear-gradient(180deg, #8B5CF6, #5B21B6); }
  .btn-medieval.big { font-size: 1.45rem; padding: 18px 36px; border-radius: 36px; }

  .scroll-card {
    background: var(--card-bg); border: 4px solid var(--card-border); border-radius: 36px;
    padding: 24px; box-shadow: var(--shadow-realm); text-align: center; position: relative;
  }

  .hero-select-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 16px; }
  .hero-card {
    background: rgba(253, 230, 138, 0.4); border: 3px solid var(--wood); border-radius: 26px;
    padding: 16px; text-align: center; cursor: pointer; transition: transform 0.15s, border-color 0.2s;
  }
  .hero-card:hover { transform: scale(1.05); border-color: var(--gold); }
  .hero-card.selected { background: #FEF08A; border-color: var(--gold-dark); box-shadow: 0 0 20px #F59E0B; }
  .hero-avatar { font-size: 3.8rem; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2)); }
  .hero-name { font-family: var(--font-heading); font-size: 1.25rem; font-weight: 700; color: var(--wood-dark); margin-top: 6px; }

  .map-container { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .mission-node {
    background: var(--card-bg); border: 3px solid var(--card-border); border-radius: 28px;
    padding: 16px 20px; display: flex; align-items: center; gap: 16px; cursor: pointer;
    box-shadow: var(--shadow-realm); transition: transform 0.15s;
  }
  .mission-node:hover { transform: translateY(-4px); }
  .mission-node:active { transform: translateY(4px); box-shadow: none; }
  .node-number {
    width: 52px; height: 52px; min-width: 52px; border-radius: 50%; background: var(--gold);
    color: #573B00; border: 3px solid #FFF; font-family: var(--font-heading); font-weight: 700;
    font-size: 1.4rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 rgba(0,0,0,0.2);
  }
  .node-icon { font-size: 2.8rem; }
  .node-info { flex: 1; text-align: left; }
  .node-title { font-family: var(--font-heading); font-size: 1.3rem; color: var(--text-main); }
  .node-desc { color: var(--text-muted); font-weight: 700; font-size: 0.92rem; }
  .mission-node.locked { opacity: 0.6; filter: grayscale(0.8); }

  .daily-chest-card {
    background: linear-gradient(135deg, #FEF3C7, #FDE68A); border: 3px solid #D97706;
    border-radius: 28px; padding: 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 16px;
    box-shadow: var(--shadow-realm); cursor: pointer; text-align: left;
  }
  .daily-chest-card .chest-icon { font-size: 3.2rem; animation: pulseChest 1.5s infinite alternate; }
  @keyframes pulseChest { from { transform: scale(1); } to { transform: scale(1.15) rotate(5deg); } }

  .word-display { font-size: 5rem; margin: 8px 0; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.2)); }
  .word-en { font-family: var(--font-heading); font-size: 2.6rem; color: var(--text-main); }
  .word-es { color: var(--text-muted); font-weight: 700; font-size: 1.2rem; margin-bottom: 14px; }

  .mic-button-realm {
    width: 120px; height: 120px; border-radius: 50%; border: 4px solid #FDE047; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #EF4444, #B91C1C); color: #FFF; font-size: 3.8rem;
    box-shadow: 0 10px 0 #78350F, 0 15px 25px rgba(239, 68, 68, 0.4); margin: 12px auto;
    display: flex; align-items: center; justify-content: center; transition: transform 0.1s;
  }
  .mic-button-realm.active { animation: pulseMic 1s infinite alternate; background: radial-gradient(circle at 35% 30%, #34D399, #059669); }
  @keyframes pulseMic { from { transform: scale(1); } to { transform: scale(1.15); } }

  .feedback-realm { font-family: var(--font-heading); font-weight: 700; font-size: 1.3rem; margin-top: 10px; min-height: 2.6rem; }
  .feedback-realm.ok { color: var(--secondary); }
  .feedback-realm.no { color: var(--coral); }

  .overlay {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-realm {
    background: var(--card-bg); border: 4px solid var(--wood); border-radius: 38px; padding: 30px 24px; text-align: center;
    max-width: 440px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.5); animation: popModal 0.4s ease;
  }
  @keyframes popModal { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>

<canvas id="webgl-canvas"></canvas>

<div id="ui-layer">
  <header>
    <div class="brand" id="brandLogo">
      <span class="brand-avatar" id="heroHeaderAvatar">🛡️</span>
      <span class="brand-title">Reino del Inglés</span>
    </div>
    <div class="header-actions">
      <button class="realm-btn" id="installBtn" style="display:none; color:var(--secondary); font-weight:bold;">⬇️ App</button>
      <button class="realm-btn" id="homeBtn">🏰 Mapa</button>
      <button class="realm-btn" id="themeBtn">🌙</button>
      <div class="badge-gold" id="starBadge">⭐ 0</div>
      <button class="realm-btn" id="albumBtn">🎒</button>
      <button class="realm-btn" id="parentBtn">⚙️</button>
    </div>
  </header>

  <main id="app"></main>
</div>

<script>
"use strict";

let scene, camera, renderer, castleGroup;
let clock = new THREE.Clock();
let isAnimating3D = true;
let raycaster, mouse, playerGroup, targetPos, mapActive = false;
let missionNodes = [];

function initMedieval3DEngine() {
  const canvas = document.getElementById('webgl-canvas');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1E1B2E);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 10, 22);
  camera.lookAt(0, 2, 0);

  // Optimización para móviles (Android/iOS)
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  // Reducir carga en pantallas móviles de alta densidad
  renderer.setPixelRatio(window.innerWidth < 768 ? 1 : Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.65);
  scene.add(ambientLight);

  const sunLight = new THREE.DirectionalLight(0xFFF3D6, 1.2);
  sunLight.position.set(20, 40, 20);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.width = 1024;
  sunLight.shadow.mapSize.height = 1024;
  scene.add(sunLight);

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  window.addEventListener('pointerdown', (ev) => {
    if(navigator.vibrate) navigator.vibrate(10);
    if(!mapActive) return;
    if(ev.target.tagName === 'BUTTON' || ev.target.closest('header') || ev.target.closest('.daily-chest-card')) return;
    mouse.x = (ev.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(ev.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(scene.children, true);
    for(let i=0; i<intersects.length; i++){
      if(intersects[i].object.name === 'ground'){
        if(targetPos) targetPos.copy(intersects[i].point);
        break;
      }
    }
  });

  buildMedievalWorld();
  window.addEventListener('resize', onResize);
  renderLoop();
}

function buildMedievalWorld() {
  // 1. Ground
  const groundGeo = new THREE.PlaneGeometry(150, 150);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x1E5631, roughness: 0.8 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  ground.name = 'ground';
  scene.add(ground);

  // 2. Central Castle (decoration)
  castleGroup = new THREE.Group();
  const baseGeo = new THREE.CylinderGeometry(6, 8, 3, 16);
  const stoneMat = new THREE.MeshStandardMaterial({ color: 0x4B5563, roughness: 0.5 });
  const base = new THREE.Mesh(baseGeo, stoneMat);
  base.castShadow = true; base.receiveShadow = true;
  castleGroup.add(base);
  
  const roofGeo = new THREE.ConeGeometry(3, 4, 12);
  const roofMat = new THREE.MeshStandardMaterial({ color: 0xB91C1C, roughness: 0.3 });
  const roof = new THREE.Mesh(roofGeo, roofMat);
  roof.position.set(0, 3.5, 0); roof.castShadow = true;
  castleGroup.add(roof);
  castleGroup.position.set(0, 1.5, -15);
  scene.add(castleGroup);

  // 3. Player Sprite
  playerGroup = new THREE.Group();
  const playerGeo = new THREE.CylinderGeometry(0.8, 0.8, 2, 8);
  const playerMat = new THREE.MeshStandardMaterial({ color: 0xFDE047, roughness: 0.5 });
  const playerBody = new THREE.Mesh(playerGeo, playerMat);
  playerBody.position.y = 1; playerBody.castShadow = true;
  playerGroup.add(playerBody);
  
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.font = '80px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🛡️', 64, 64);
  const tex = new THREE.CanvasTexture(canvas);
  const spriteMat = new THREE.SpriteMaterial({ map: tex });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.position.y = 3.5; sprite.scale.set(3, 3, 3); sprite.name = 'heroSprite';
  playerGroup.add(sprite);

  playerGroup.position.set(0, 0, 10);
  targetPos = playerGroup.position.clone();
  scene.add(playerGroup);

  // 4. Mission Nodes
  for(let i=0; i<20; i++){
    const ang = (i / 20) * Math.PI * 2 + Math.PI;
    const rad = 15 + Math.random() * 10;
    const x = Math.cos(ang) * rad;
    const z = Math.sin(ang) * rad;
    
    const flagGroup = new THREE.Group();
    const poleGeo = new THREE.CylinderGeometry(0.1, 0.1, 3);
    const pole = new THREE.Mesh(poleGeo, new THREE.MeshStandardMaterial({ color:0x451A03 }));
    pole.position.y = 1.5; pole.castShadow = true;
    flagGroup.add(pole);

    const fGeo = new THREE.PlaneGeometry(1.5, 1);
    const fMat = new THREE.MeshStandardMaterial({ color: 0x3B82F6, side: THREE.DoubleSide });
    const f = new THREE.Mesh(fGeo, fMat);
    f.position.set(0.75, 2.5, 0); f.castShadow = true;
    flagGroup.add(f);
    
    // Label
    const cLabel = document.createElement('canvas');
    cLabel.width = 64; cLabel.height = 64;
    const ctxL = cLabel.getContext('2d');
    ctxL.fillStyle = 'white'; ctxL.font = 'bold 40px Arial'; ctxL.textAlign = 'center'; ctxL.textBaseline = 'middle';
    ctxL.fillText((i+1)+'', 32, 32);
    const lTex = new THREE.CanvasTexture(cLabel);
    const lMat = new THREE.SpriteMaterial({ map: lTex });
    const lSpr = new THREE.Sprite(lMat);
    lSpr.position.set(0, 4, 0); lSpr.scale.set(2, 2, 2);
    flagGroup.add(lSpr);

    flagGroup.position.set(x, 0, z);
    scene.add(flagGroup);

    missionNodes.push({ id: i+1, mesh: flagGroup, x: x, z: z, active: true });
  }
}

function updateHeroSprite3D() {
  if(!playerGroup) return;
  const h = HEROES.find(x => x.id === state.selectedHero) || HEROES[0];
  const s = playerGroup.children.find(c => c.name === 'heroSprite');
  if(s){
    const ctx = s.material.map.image.getContext('2d');
    ctx.clearRect(0,0,128,128);
    ctx.fillText(h.avatar, 64, 64);
    s.material.map.needsUpdate = true;
  }
}

function renderLoop() {
  requestAnimationFrame(renderLoop);
  if (!isAnimating3D) return;
  const t = clock.getElapsedTime();
  
  if(castleGroup) castleGroup.rotation.y = Math.sin(t * 0.3) * 0.2;

  if (playerGroup && targetPos && mapActive) {
    playerGroup.position.lerp(targetPos, 0.05);
    playerGroup.children[1].position.y = 3.5 + Math.sin(t * 4) * 0.2;

    camera.position.x = THREE.MathUtils.lerp(camera.position.x, playerGroup.position.x, 0.05);
    camera.position.z = THREE.MathUtils.lerp(camera.position.z, playerGroup.position.z + 18, 0.05);
    camera.lookAt(playerGroup.position.x, 2, playerGroup.position.z);

    for (let i = 0; i < missionNodes.length; i++) {
      const node = missionNodes[i];
      if (node.active) {
        const dist = Math.hypot(playerGroup.position.x - node.x, playerGroup.position.z - node.z);
        if (dist < 2.5) {
          const unlocked = (node.id === 1) || (state.stars >= ((node.id - 1) * 10));
          if(unlocked){
            node.active = false;
            targetPos.copy(playerGroup.position);
            launchMissionGame(node.id);
          } else {
             targetPos.x += (playerGroup.position.x - node.x);
             targetPos.z += (playerGroup.position.z - node.z);
          }
        }
      }
    }
  }

  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

const HEROES = [
  { id: 'knight', name: 'Caballero Valiente', avatar: '🛡️', desc: '¡Protege el reino con su espada mágica!' },
  { id: 'princess', name: 'Princesa Guerrera', avatar: '⚔️', desc: '¡Líder de la guardia del castillo!' },
  { id: 'wizard', name: 'Mago del Inglés', avatar: '🧙‍♂️', desc: '¡Domina los pergaminos e hechizos!' },
  { id: 'dragon', name: 'Dragón Amistoso', avatar: '🐲', desc: '¡Vuela sobre las torres echando fuego de colores!' }
];

const MISSIONS_20 = [
  { id: 1, title: 'El Huerto de los Campesinos', icon: '🌾', words: [{en:'red',es:'rojo',e:'🔴'},{en:'blue',es:'azul',e:'🔵'},{en:'green',es:'verde',e:'🟢'},{en:'yellow',es:'amarillo',e:'🟡'},{en:'orange',es:'naranja',e:'🟠'},{en:'purple',es:'morado',e:'🟣'},{en:'pink',es:'rosa',e:'🌸'},{en:'black',es:'negro',e:'⚫'},{en:'white',es:'blanco',e:'⚪'},{en:'brown',es:'marrón',e:'🟤'}] },
  { id: 2, title: 'El Conteo de las Ovejas del Reino', icon: '🔢', words: [{en:'one',es:'uno',e:'1️⃣'},{en:'two',es:'dos',e:'2️⃣'},{en:'three',es:'tres',e:'3️⃣'},{en:'four',es:'cuatro',e:'4️⃣'},{en:'five',es:'cinco',e:'5️⃣'},{en:'six',es:'seis',e:'6️⃣'},{en:'seven',es:'siete',e:'7️⃣'},{en:'eight',es:'ocho',e:'8️⃣'},{en:'nine',es:'nueve',e:'9️⃣'},{en:'ten',es:'diez',e:'🔟'}] },
  { id: 3, title: 'Los Animales del Castillo', icon: '🐶', words: [{en:'dog',es:'perro',e:'🐶'},{en:'cat',es:'gato',e:'🐱'},{en:'bird',es:'pájaro',e:'🐦'},{en:'fish',es:'pez',e:'🐟'},{en:'horse',es:'caballo',e:'🐴'},{en:'cow',es:'vaca',e:'🐮'},{en:'pig',es:'cerdo',e:'🐷'},{en:'lion',es:'león',e:'🦁'},{en:'monkey',es:'mono',e:'🐵'},{en:'elephant',es:'elefante',e:'🐘'}] },
  { id: 4, title: 'El Banquete Real', icon: '🍎', words: [{en:'apple',es:'manzana',e:'🍎'},{en:'banana',es:'plátano',e:'🍌'},{en:'bread',es:'pan',e:'🍞'},{en:'milk',es:'leche',e:'🥛'},{en:'water',es:'agua',e:'💧'},{en:'egg',es:'huevo',e:'🥚'},{en:'cheese',es:'queso',e:'🧀'},{en:'pizza',es:'pizza',e:'🍕'},{en:'cake',es:'tarta',e:'🎂'},{en:'cookie',es:'galleta',e:'🍪'}] },

let state = { selectedHero: 'knight', stars: 0, dailyChestClaimed: false, theme: 'day' };
function loadState() {
  try {
    const raw = localStorage.getItem('reinoInglesState');
    if(raw) state = Object.assign(state, JSON.parse(raw));
    updateHeaderHero();
    if(state.theme === 'night') document.documentElement.setAttribute('data-theme', 'night');
  } catch(e){}
}
function saveState() {
  try { localStorage.setItem('reinoInglesState', JSON.stringify(state)); } catch(e){}
}

function updateHeaderHero() {
  const h = HEROES.find(x => x.id === state.selectedHero) || HEROES[0];
  document.getElementById('heroHeaderAvatar').textContent = h.avatar;
  document.getElementById('starBadge').textContent = '⭐ ' + state.stars;
}

let audioCtx = null;
function playSound(type) {
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume(); // Vital para Android Chrome
    let t = audioCtx.currentTime;
    let osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.connect(g); g.connect(audioCtx.destination);
    if(type === 'good') {
      if(navigator.vibrate) navigator.vibrate([30,50,30]);
      osc.frequency.setValueAtTime(523, t); osc.frequency.setValueAtTime(659, t+0.1); osc.frequency.setValueAtTime(784, t+0.2);
      g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.01, t+0.35);
      osc.start(t); osc.stop(t+0.35);
    } else if(type === 'bad') {
      if(navigator.vibrate) navigator.vibrate(100);
      osc.frequency.setValueAtTime(220, t); osc.frequency.setValueAtTime(180, t+0.12);
      g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.01, t+0.3);
      osc.start(t); osc.stop(t+0.3);
    } else if(type === 'star') {
      if(navigator.vibrate) navigator.vibrate([20,50,40,50,60]);
      osc.frequency.setValueAtTime(880, t); osc.frequency.setValueAtTime(1320, t+0.08);
      g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.01, t+0.2);
      osc.start(t); osc.stop(t+0.2);
    }
  } catch(e){}
}

function speakText(text) {
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.82; u.pitch = 1.05;
  window.speechSynthesis.speak(u);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let activeSR = null;
function stopSR() {
  if(activeSR) { try { activeSR.abort(); } catch(e){} activeSR = null; }
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
}

function launchMissionGame(mid) {
  isAnimating3D = false;
  mapActive = false;
  const m = MISSIONS_20.find(x => x.id === mid);
  let idx = 0, score = 0;
  
  // Generate a randomized session of 10 exercises
  let session = [];
  for(let i=0; i<10; i++){
    const w = m.words[Math.floor(Math.random() * m.words.length)];
    const types = ['speak', 'listen', 'translate', 'spell'];
    session.push({ word: w, type: types[Math.floor(Math.random() * types.length)] });
  }

  function drawExercise() {
    const current = session[idx];
    const w = current.word;
    const type = current.type;
    const hasSR = !!SR;

    let options = [w];
    while(options.length < 4) {
      const randW = m.words[Math.floor(Math.random() * m.words.length)];
      if(!options.includes(randW)) options.push(randW);
    }
    options.sort(() => Math.random() - 0.5);

    let gameHtml = '';
    if(type === 'speak' || (!hasSR && type === 'speak')) {
      gameHtml = `
        <div class="word-display">${w.e}</div>
        <div class="word-en">${w.en}</div>
        <div class="word-es">${w.es}</div>
        <div style="margin:16px 0;">
          <button class="btn-medieval blue" id="hearWordBtn">🔊 Escuchar</button>
          ${hasSR ? `
            <div style="margin-top:14px;">
              <button class="mic-button-realm" id="micBtnRealm">🎤</button>
              <div class="feedback-realm" id="fbRealm">Pulsa y habla</div>
              <div style="color:var(--text-muted); font-weight:700;" id="heardRealm"></div>
            </div>
          ` : `<div style="margin-top:14px;"><button class="btn-medieval green" id="okBtn">✔️ Lo he dicho</button></div>`}
        </div>`;
    } else if(type === 'listen') {
      gameHtml = `
        <div style="font-size:4rem; margin:10px 0;">👂🎶</div>
        <div style="color:var(--text-muted); font-weight:700; margin-bottom:16px;">Toca el botón azul para escuchar y elige el dibujo correcto:</div>
        <button class="btn-medieval blue big" id="hearWordBtn">🔊 Escuchar Palabra</button>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px;">
          ${options.map(opt => `<button class="btn-medieval opt-btn" style="font-size:3rem; padding:10px;" data-ans="${opt.en === w.en}">${opt.e}</button>`).join('')}
        </div>
        <div class="feedback-realm" id="fbRealm"></div>`;
    } else if(type === 'translate') {
      gameHtml = `
        <div class="word-display">${w.e}</div>
        <div class="word-es" style="font-size:1.6rem; color:var(--text-main);">${w.es}</div>
        <div style="color:var(--text-muted); font-weight:700; margin-bottom:16px;">¿Cómo se dice en inglés?</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          ${options.map(opt => `<button class="btn-medieval opt-btn" style="font-size:1.3rem; padding:16px 10px;" data-ans="${opt.en === w.en}">${opt.en}</button>`).join('')}
        </div>
        <div class="feedback-realm" id="fbRealm"></div>`;
    } else if(type === 'spell') {
      const letters = w.en.split('').sort(() => Math.random() - 0.5);
      gameHtml = `
        <div class="word-display">${w.e}</div>
        <div style="color:var(--text-muted); font-weight:700; margin-bottom:16px;">Toca las letras para escribir: <b>${w.es}</b></div>
        <div id="spellTarget" style="min-height:50px; background:rgba(255,253,245,0.5); border:3px dashed var(--wood); border-radius:12px; display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:16px; padding:10px; font-family:var(--font-heading); font-size:2rem; color:var(--primary-dark); letter-spacing:4px;"></div>
        <div id="spellLetters" style="display:flex; justify-content:center; flex-wrap:wrap; gap:8px;">
          ${letters.map(l => `<button class="btn-medieval spell-btn" style="padding:10px 16px; font-size:1.5rem;">${l}</button>`).join('')}
        </div>
        <div class="feedback-realm" id="fbRealm"></div>`;
    }

    app.innerHTML = `
      <button class="btn-medieval" id="backMapBtn" style="margin-bottom:12px; position:absolute; top:-60px; left:0; z-index:50;">⬅ Volver</button>
      <div class="scroll-card" style="margin-top:60px;">
        <div style="font-family:var(--font-heading); font-size:1.3rem; color:var(--wood-dark);">Misión ${m.id} · Ej. ${idx+1}/10</div>
        ${gameHtml}
        <button class="btn-medieval big green" id="nextExBtn" style="display:none; width:100%; margin-top:20px;">Siguiente ➡</button>
      </div>`;

    document.getElementById('backMapBtn').onclick = renderWorldMap;
    const nextBtn = document.getElementById('nextExBtn');
    nextBtn.onclick = stepNext;

    if(type === 'speak') {
      document.getElementById('hearWordBtn').onclick = () => speakText(w.en);
      speakText(w.en);
      if(hasSR) {
        const mic = document.getElementById('micBtnRealm');
        const fb = document.getElementById('fbRealm');
        const heard = document.getElementById('heardRealm');
        mic.onclick = () => {
          stopSR();
          const rec = new SR();
          activeSR = rec;
          rec.lang = 'en-US'; rec.continuous = false; rec.interimResults = false;
          mic.classList.add('active'); fb.className = 'feedback-realm'; fb.textContent = 'Te escucho… 👂';
          rec.onresult = (ev) => {
            if (!ev.results || !ev.results[0]) return;
            const t = ev.results[0][0].transcript.toLowerCase();
            heard.textContent = `He oído: "${t}"`;
            const cleanT = t.replace(/[.,!?]/g, '').trim();
            const spokenWords = cleanT.split(/\s+/);
            const targetWord = w.en.toLowerCase();
            if(cleanT === targetWord || spokenWords.includes(targetWord)) {
              playSound('good'); score++; fb.className = 'feedback-realm ok'; fb.textContent = '¡Excelente! 🌟'; nextBtn.style.display = 'block'; mic.style.display = 'none';
            } else {
              playSound('bad'); fb.className = 'feedback-realm no'; fb.textContent = '¡Casi! Escucha y repite';
            }
          };
          rec.onerror = (e) => { mic.classList.remove('active'); fb.className = 'feedback-realm no'; fb.textContent = e.error==='not-allowed'?'¡Micro denegado!':'Error. Reintenta.'; };
          rec.onend = () => mic.classList.remove('active');
          try { rec.start(); } catch(e){ mic.classList.remove('active'); fb.className = 'feedback-realm no'; fb.textContent = 'No soportado aquí'; }
        };
      } else {
        document.getElementById('okBtn').onclick = () => { playSound('good'); score++; stepNext(); };
      }
    } 
    else if(type === 'listen' || type === 'translate') {
      if(type === 'listen') {
        document.getElementById('hearWordBtn').onclick = () => speakText(w.en);
        speakText(w.en);
      }
      const fb = document.getElementById('fbRealm');
      document.querySelectorAll('.opt-btn').forEach(btn => {
        btn.onclick = () => {
          if(btn.dataset.ans === 'true') {
            playSound('good'); score++; fb.className = 'feedback-realm ok'; fb.textContent = '¡Correcto! 🌟';
            document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
            btn.style.background = 'var(--secondary)'; nextBtn.style.display = 'block';
          } else {
            playSound('bad'); fb.className = 'feedback-realm no'; fb.textContent = '¡Ups! Intenta de nuevo.';
            btn.style.opacity = '0.4'; btn.disabled = true;
          }
        };
      });
    }
    else if(type === 'spell') {
      const fb = document.getElementById('fbRealm');
      const targetDiv = document.getElementById('spellTarget');
      let currentSpell = "";
      document.querySelectorAll('.spell-btn').forEach(btn => {
        btn.onclick = () => {
          playSound('star');
          currentSpell += btn.textContent;
          targetDiv.textContent = currentSpell;
          btn.style.visibility = 'hidden';
          
          if(currentSpell.length === w.en.length) {
            if(currentSpell === w.en) {
              playSound('good'); score++; fb.className = 'feedback-realm ok'; fb.textContent = '¡Perfecto! 🌟';
              nextBtn.style.display = 'block'; speakText(w.en);
            } else {
              playSound('bad'); fb.className = 'feedback-realm no'; fb.textContent = '¡Uy! Letras incorrectas.';
              setTimeout(() => {
                currentSpell = ""; targetDiv.textContent = "";
                document.querySelectorAll('.spell-btn').forEach(b => b.style.visibility = 'visible');
                fb.textContent = '';
              }, 1000);
            }
          }
        };
      });
    }

    function stepNext() {
      idx++;
      if(idx < 10) drawExercise();
      else showRewardModal(score, () => {
        state.stars += score * 2; saveState(); updateHeaderHero(); renderWorldMap();
      });
    }
  }

  drawExercise();
}
function showRewardModal(score, onClose) {
  playSound('star');
  const modal = document.createElement('div');
  modal.className = 'overlay';
  modal.innerHTML = `
    <div class="modal-realm">
      <div style="font-size:4rem;">🏆✨</div>
      <h2 style="color:var(--wood-dark);">¡Misión Completada!</h2>
      <div style="font-size:2.5rem; letter-spacing:4px; margin:10px 0;">⭐⭐⭐⭐⭐</div>
      <p style="color:var(--text-muted); font-weight:700;">¡Has ganado +${score * 2} Estrellas Mágicas!</p>
      <button class="btn-medieval big green" id="questCloseBtn">¡Continuar Aventura! 🛡️</button>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById('questCloseBtn').onclick = () => { modal.remove(); onClose(); };
}

function renderAlbum() {
  isAnimating3D = false;
  const owned = Math.min(STICKERS.length, Math.floor(state.stars / 15));
  app.innerHTML = `
    <button class="btn-medieval" id="backMapBtn" style="margin-bottom:12px;">⬅ Volver al Mapa</button>
    <div class="scroll-card">
      <h1 style="color:var(--wood-dark);">🎒 Tesoros del Reino</h1>
      <p style="color:var(--text-muted); font-weight:700;">Ganas 1 insignia por cada 15 ⭐ (Tienes ${owned} de ${STICKERS.length})</p>
      <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:16px;">
        ${STICKERS.map((s,i)=>`<div style="aspect-ratio:1; background:rgba(253, 230, 138, 0.4); border:2px solid var(--wood); border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:2.5rem; ${i<owned?'':'filter:grayscale(1); opacity:0.3;'}">${i<owned?s:'❓'}</div>`).join('')}
      </div>
    </div>`;
  document.getElementById('backMapBtn').onclick = renderWorldMap;
}

document.getElementById('brandLogo').onclick = renderHeroSelect;
document.getElementById('homeBtn').onclick = renderWorldMap;
document.getElementById('albumBtn').onclick = renderAlbum;

document.getElementById('themeBtn').onclick = () => {
  state.theme = state.theme === 'day' ? 'night' : 'day';
  if(state.theme === 'night') document.documentElement.setAttribute('data-theme', 'night');
  else document.documentElement.removeAttribute('data-theme');
  saveState();
};

document.getElementById('parentBtn').onclick = () => {
  alert('Área para padres en construcción. ¡Próximamente!');
};


let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const installBtn = document.getElementById('installBtn');
  if(installBtn) {
    installBtn.style.display = 'flex';
    installBtn.onclick = async () => {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.style.display = 'none';
      }
      deferredPrompt = null;
    };
  }
});

loadState();
initMedieval3DEngine();
if(!state.selectedHero) renderHeroSelect();
else renderWorldMap();
if('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Reg Failed:', err));
  });
}
</script>
</body>
</html>
