<script>
"use strict";

let scene, camera, renderer, castleGroup;
let clock = new THREE.Clock();

function initMedieval3DEngine() {
  const canvas = document.getElementById('webgl-canvas');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1E1B2E);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 10, 22);
  camera.lookAt(0, 2, 0);

  // Optimización para móviles (Android/iOS)
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  // Reducir carga en pantallas móviles de alta densidad
  renderer.setPixelRatio(window.innerWidth < 768 ? 1 : Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.65);
  scene.add(ambientLight);

  const sunLight = new THREE.DirectionalLight(0xFFF3D6, 1.2);
  sunLight.position.set(20, 40, 20);
  sunLight.castShadow = true;
  scene.add(sunLight);

  buildMedievalWorld();
  window.addEventListener('resize', onResize);
  renderLoop();
}

function buildMedievalWorld() {
  castleGroup = new THREE.Group();
  const baseGeo = new THREE.CylinderGeometry(8, 10, 3, 16);
  const stoneMat = new THREE.MeshStandardMaterial({ color: 0x4B5563, roughness: 0.5 });
  const base = new THREE.Mesh(baseGeo, stoneMat);
  castleGroup.add(base);

  const towerGeo = new THREE.CylinderGeometry(1.8, 1.8, 5, 12);
  const tower = new THREE.Mesh(towerGeo, stoneMat);
  tower.position.set(0, 3.5, 0);
  castleGroup.add(tower);

  const roofGeo = new THREE.ConeGeometry(2.3, 3, 12);
  const roofMat = new THREE.MeshStandardMaterial({ color: 0xB91C1C, roughness: 0.3 });
  const roof = new THREE.Mesh(roofGeo, roofMat);
  roof.position.set(0, 7.5, 0);
  castleGroup.add(roof);

  castleGroup.position.set(0, 0, 0);
  scene.add(castleGroup);
}

function renderLoop() {
  requestAnimationFrame(renderLoop);
  const t = clock.getElapsedTime();
  if(castleGroup) castleGroup.rotation.y = Math.sin(t * 0.3) * 0.2;
  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

const STICKERS = ['🛡️','⚔️','👑','🐴','🐉','🏰','📜','🔮','💎','🥇','🏆','🎺','🏹','🎨','⭐','🌙','☀️','🔥','⚡','🎁'];

let state = { selectedHero: 'knight', stars: 0, dailyChestClaimed: false, theme: 'day' };
function loadState() {
  try {
    const raw = localStorage.getItem('reinoInglesState');
    if(raw) state = Object.assign(state, JSON.parse(raw));
    updateHeaderHero();
  } catch(e){}
}
function saveState() {
  try { localStorage.setItem('reinoInglesState', JSON.stringify(state)); } catch(e){}
}

function updateHeaderHero() {
  const h = HEROES.find(x => x.id === state.selectedHero) || HEROES[0];
  document.getElementById('heroHeaderAvatar').textContent = h.avatar;
  document.getElementById('starBadge').textContent = '⭐ ' + state.stars;
}

let audioCtx = null;
function playSound(type) {
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume(); // Vital para Android Chrome
    let t = audioCtx.currentTime;
    let osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.connect(g); g.connect(audioCtx.destination);
    if(type === 'good') {
      osc.frequency.setValueAtTime(523, t); osc.frequency.setValueAtTime(659, t+0.1); osc.frequency.setValueAtTime(784, t+0.2);
      g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.01, t+0.35);
      osc.start(t); osc.stop(t+0.35);
    } else if(type === 'bad') {
      osc.frequency.setValueAtTime(220, t); osc.frequency.setValueAtTime(180, t+0.12);
      g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.01, t+0.3);
      osc.start(t); osc.stop(t+0.3);
    } else if(type === 'star') {
      osc.frequency.setValueAtTime(880, t); osc.frequency.setValueAtTime(1320, t+0.08);
      g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.01, t+0.2);
      osc.start(t); osc.stop(t+0.2);
    }
  } catch(e){}
}

function speakText(text) {
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.82; u.pitch = 1.05;
  window.speechSynthesis.speak(u);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let activeSR = null;
function stopSR() {
  if(activeSR) { try { activeSR.abort(); } catch(e){} activeSR = null; }
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
}

const app = document.getElementById('app');

function renderHeroSelect() {
  app.innerHTML = `
    <div class="scroll-card">
      <h1 style="font-size:2.2rem; color:var(--wood-dark);">👑 Elige a tu Héroe Medieval</h1>
      <p style="color:var(--text-muted); font-weight:700;">Selecciona el personaje que salvará el Reino del Inglés:</p>
      
      <div class="hero-select-grid">
        ${HEROES.map(h => `
          <div class="hero-card ${state.selectedHero===h.id?'selected':''}" data-hid="${h.id}">
            <div class="hero-avatar">${h.avatar}</div>
            <div class="hero-name">${h.name}</div>
            <div style="font-size:0.85rem; color:var(--text-muted); margin-top:4px;">${h.desc}</div>
          </div>
        `).join('')}
      </div>

      <button class="btn-medieval big green" id="startQuestBtn" style="margin-top:20px;">¡Comenzar Aventura! 🛡️</button>
    </div>`;

  app.querySelectorAll('.hero-card').forEach(card => {
    card.onclick = () => {
      state.selectedHero = card.dataset.hid;
      saveState(); updateHeaderHero(); renderHeroSelect();
    };
  });

  document.getElementById('startQuestBtn').onclick = renderWorldMap;
}

function renderWorldMap() {
  stopSR(); updateHeaderHero();
  let html = `
    <div class="scroll-card" style="margin-bottom:16px;">
      <h1 style="font-size:2rem; color:var(--wood-dark);">🗺️ Mapa del Reino (20 Misiones)</h1>
      <p style="color:var(--text-muted); font-weight:700;">Supera las 20 misiones para rescatar a la princesa y derrotar al Rey Oscuro</p>
    </div>

    ${!state.dailyChestClaimed ? `
      <div class="daily-chest-card" id="dailyChestBtn">
        <div class="chest-icon">🎁</div>
        <div>
          <b style="font-family:var(--font-heading); font-size:1.3rem; color:var(--wood-dark);">Cofre de Recompensa Diario</b>
          <div style="font-size:0.95rem; color:var(--wood-dark);">¡Toca para abrir tu regalo de hoy y ganar estrellas!</div>
        </div>
      </div>
    ` : ''}

    <div class="map-container">`;

  MISSIONS_20.forEach((m, idx) => {
    const unlocked = idx === 0 || state.stars >= (idx * 10);
    html += `
      <div class="mission-node ${unlocked?'':'locked'}" data-mid="${m.id}">
        <div class="node-number">${m.id}</div>
        <div class="node-icon">${m.icon}</div>
        <div class="node-info">
          <div class="node-title">Misión ${m.id}: ${m.title}</div>
          <div class="node-desc">${unlocked ? '10 ejercicios variados de inglés' : `Requiere ${idx*10} ⭐`}</div>
        </div>
      </div>`;
  });

  html += `</div>`;
  app.innerHTML = html;

  if(document.getElementById('dailyChestBtn')) {
    document.getElementById('dailyChestBtn').onclick = claimDailyReward;
  }

  app.querySelectorAll('.mission-node:not(.locked)').forEach(node => {
    node.onclick = () => launchMissionGame(+node.dataset.mid);
  });
}

function claimDailyReward() {
  playSound('star');
  state.stars += 20;
  state.dailyChestClaimed = true;
  saveState(); updateHeaderHero();

  const modal = document.createElement('div');
  modal.className = 'overlay';
  modal.innerHTML = `
    <div class="modal-realm">
      <div style="font-size:4rem;">🎁✨</div>
      <h2 style="color:var(--wood-dark);">¡Cofre Diario Abierto!</h2>
      <p style="font-size:1.2rem; color:var(--text-muted); font-weight:700;">¡Has recibido +20 Estrellas Mágicas!</p>
      <button class="btn-medieval big green" id="claimCloseBtn">¡Genial! 🏰</button>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById('claimCloseBtn').onclick = () => { modal.remove(); renderWorldMap(); };
}

function launchMissionGame(mid) {
  const m = MISSIONS_20.find(x => x.id === mid);
  let idx = 0, score = 0;

  function drawExercise() {
    const w = m.words[idx % m.words.length];
    const hasSR = !!SR;

    app.innerHTML = `
      <button class="btn-medieval" id="backMapBtn" style="margin-bottom:12px;">⬅ Volver al Mapa</button>
      <div class="scroll-card">
        <div style="font-family:var(--font-heading); font-size:1.3rem; color:var(--wood-dark);">Misión ${m.id} · Ejercicio ${idx+1} de 10</div>
        
        <div class="word-display">${w.e}</div>
        <div class="word-en">${w.en}</div>
        <div class="word-es">${w.es}</div>

        <div style="margin:16px 0;">
          <button class="btn-medieval blue" id="hearWordBtn">🔊 Escuchar en Inglés</button>

          ${hasSR ? `
            <div style="margin-top:14px;">
              <button class="mic-button-realm" id="micBtnRealm">🎤</button>
              <div class="feedback-realm" id="fbRealm">Pulsa el micro y dilo en voz alta</div>
              <div style="color:var(--text-muted); font-weight:700;" id="heardRealm"></div>
            </div>
          ` : `
            <div class="feedback-realm">Dilo en voz alta. Validación guiada:</div>
            <div style="display:flex; gap:10px; justify-content:center; margin-top:10px;">
              <button class="btn-medieval green" id="okBtn">✔️ ¡Lo dijo bien!</button>
              <button class="btn-medieval red" id="koBtn">Repetir</button>
            </div>
          `}
        </div>

        <button class="btn-medieval big green" id="nextExBtn">Siguiente Ejercicio ➡</button>
      </div>`;

    document.getElementById('backMapBtn').onclick = renderWorldMap;
    document.getElementById('hearWordBtn').onclick = () => speakText(w.en);
    setTimeout(() => speakText(w.en), 350);

    if(hasSR) {
      const mic = document.getElementById('micBtnRealm');
      const fb = document.getElementById('fbRealm');
      const heard = document.getElementById('heardRealm');

      mic.onclick = () => {
        stopSR();
        const rec = new SR();
        activeSR = rec;
        rec.lang = 'en-US';
        rec.continuous = false; // Mejor compatibilidad en Android
        rec.interimResults = false;
        
        mic.classList.add('active');
        fb.className = 'feedback-realm'; fb.textContent = 'Te escucho… 👂';

        rec.onresult = (ev) => {
          if (!ev.results || !ev.results[0]) return;
          const t = ev.results[0][0].transcript.toLowerCase();
          heard.textContent = `He oído: "${t}"`;
          
          // Limpieza extra para Android que a veces añade puntuación
          const cleanT = t.replace(/[.,!?]/g, '').trim();
          
          if(cleanT.includes(w.en.toLowerCase())) {
            playSound('good'); score++;
            fb.className = 'feedback-realm ok'; fb.textContent = '¡Excelente! 🌟';
          } else {
            playSound('bad');
            fb.className = 'feedback-realm no'; fb.textContent = '¡Casi! Escucha y repite';
          }
        };

        rec.onerror = (e) => {
          mic.classList.remove('active');
          fb.className = 'feedback-realm no'; 
          fb.textContent = e.error === 'not-allowed' ? '¡Micro denegado!' : 'Error de micro. Reintenta.';
        };
        rec.onend = () => mic.classList.remove('active');

        try { rec.start(); } catch(e){
          mic.classList.remove('active');
          fb.className = 'feedback-realm no'; fb.textContent = 'No soportado aquí';
        }
      };
    } else {
      document.getElementById('okBtn').onclick = () => { playSound('good'); score++; stepNext(); };
      document.getElementById('koBtn').onclick = () => { playSound('bad'); speakText(w.en); };
    }

    document.getElementById('nextExBtn').onclick = stepNext;

    function stepNext() {
      idx++;
      if(idx < 10) drawExercise();
      else showRewardModal(score, () => {
        state.stars += score * 2; saveState(); updateHeaderHero(); renderWorldMap();
      });
    }
  }

  drawExercise();
}

function showRewardModal(score, onClose) {
  playSound('star');
  const modal = document.createElement('div');
  modal.className = 'overlay';
  modal.innerHTML = `
    <div class="modal-realm">
      <div style="font-size:4rem;">🏆✨</div>
      <h2 style="color:var(--wood-dark);">¡Misión Completada!</h2>
      <div style="font-size:2.5rem; letter-spacing:4px; margin:10px 0;">⭐⭐⭐⭐⭐</div>
      <p style="color:var(--text-muted); font-weight:700;">¡Has ganado +${score * 2} Estrellas Mágicas!</p>
      <button class="btn-medieval big green" id="questCloseBtn">¡Continuar Aventura! 🛡️</button>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById('questCloseBtn').onclick = () => { modal.remove(); onClose(); };
}

function renderAlbum() {
  const owned = Math.min(STICKERS.length, Math.floor(state.stars / 15));
  app.innerHTML = `
    <button class="btn-medieval" id="backMapBtn" style="margin-bottom:12px;">⬅ Volver al Mapa</button>
    <div class="scroll-card">
      <h1 style="color:var(--wood-dark);">🎒 Tesoros del Reino</h1>
      <p style="color:var(--text-muted); font-weight:700;">Ganas 1 insignia por cada 15 ⭐ (Tienes ${owned} de ${STICKERS.length})</p>
      <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:16px;">
        ${STICKERS.map((s,i)=>`<div style="aspect-ratio:1; background:rgba(253, 230, 138, 0.4); border:2px solid var(--wood); border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:2.5rem; ${i<owned?'':'filter:grayscale(1); opacity:0.3;'}">${i<owned?s:'❓'}</div>`).join('')}
      </div>
    </div>`;
  document.getElementById('backMapBtn').onclick = renderWorldMap;
}

document.getElementById('brandLogo').onclick = renderHeroSelect;
document.getElementById('homeBtn').onclick = renderWorldMap;
document.getElementById('albumBtn').onclick = renderAlbum;

loadState();
initMedieval3DEngine();
if(!state.selectedHero) renderHeroSelect();
else renderWorldMap();
if('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Reg Failed:', err));
  });
}
