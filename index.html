<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7C2D12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>El Reino del Inglés · Aventura Medieval</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=MedievalSharp&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<canvas id="webgl-canvas"></canvas>
<div id="stageFallback" aria-hidden="true"></div>

<div id="ui-layer">
  <header>
    <div class="brand">
      <span class="brand-avatar" id="heroAv">🛡️</span>
      <span class="brand-title" id="nameTxt">Reino del Inglés</span>
    </div>
    <div class="hactions">
      <div class="pill" id="starN" title="Estrellas">⭐ 0</div>
      <div class="pill" id="coinN" title="Monedas">🪙 5</div>
      <button class="hbtn" id="homeBtn" aria-label="Mapa">🏰</button>
      <button class="hbtn" id="albumBtn" aria-label="Tesoros">🎒</button>
      <button class="hbtn" id="setBtn" aria-label="Ajustes">⚙️</button>
    </div>
  </header>
  <main id="app"></main>
</div>

<script src="content.js"></script>
<script src="audio.js"></script>
<script src="scene3d.js"></script>
<script src="game.js"></script>
</body>
</html>
